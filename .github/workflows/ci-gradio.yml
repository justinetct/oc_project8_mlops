# CI Gradio — service de scoring crédit.
#
# Tests unitaires + build Docker sur push (main, staging, feature/*, fix/*, chore/*)
# et pull request vers main. Le déploiement Render préprod sur la branche staging
# est déclenché automatiquement par Render via "After CI Checks Pass" (aucune étape
# de déploiement n'est définie dans ce workflow).

name: CI Gradio

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # 1. Tests unitaires avec Poetry
  # -----------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache des dépendances Poetry
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Installation des dépendances
        run: poetry install --only main,gradio,dev

      - name: Tests app_gradio (scoring)
        run: |
          poetry run pytest \
            tests/test_predict.py \
            tests/test_predict_onnx.py \
            tests/test_validation.py \
            tests/test_integration.py \
            tests/test_scoring_service.py \
            tests/test_benchmark_baseline.py \
            tests/test_non_regression.py \
            -v

      - name: Vérification cohérence requirements
        run: |
          poetry self add poetry-plugin-export
          make export-requirements-gradio
          git diff --exit-code requirements.gradio.txt || {
            echo "::error::requirements.gradio.txt n'est pas à jour avec poetry.lock. Lancez 'make export-requirements-gradio' et commitez le fichier mis à jour."
            exit 1
          }

  # -----------------------------------------------------------------------
  # 2. Build de l'image Docker (exécuté uniquement si les tests ont passé)
  # -----------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Gradio
        run: docker build -f Dockerfile.gradio -t scoring-gradio .
