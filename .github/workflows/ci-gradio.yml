# CI/CD — Service Gradio de scoring crédit
#
# Déclenché sur push (main, staging, feature/*, fix/*) ou pull request vers main.
# 3 étapes : tests → build Docker → déploiement Render préprod (staging uniquement).
#
# Stratégie de déploiement :
#   - staging  → Render préprod (via deploy hook)
#   - main     → Render prod (à venir)
#   - autres   → tests + build Docker uniquement
#
# Hugging Face Spaces a été abandonné (instabilité persistante).

name: CI Gradio

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # 1. Tests unitaires avec Poetry
  # -----------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache des dépendances Poetry
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Installation des dépendances
        run: poetry install --only main,gradio,dev

      - name: Lancement des tests
        run: poetry run pytest tests/ -v

      - name: Vérification cohérence requirements
        run: |
          poetry self add poetry-plugin-export
          make export-requirements-gradio
          git diff --exit-code requirements.gradio.txt || \
            echo "::warning::requirements.gradio.txt n'est pas à jour avec poetry.lock"

  # -----------------------------------------------------------------------
  # 2. Build de l'image Docker
  # -----------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Gradio
        run: docker build -f Dockerfile.gradio -t scoring-gradio .

  # -----------------------------------------------------------------------
  # 3. Déploiement Render préprod (staging uniquement)
  #
  #    Déclenche un rebuild du service Render via son deploy hook.
  #    Le service Render utilise le Dockerfile.gradio depuis le repo GitHub.
  # -----------------------------------------------------------------------
  deploy-preprod:
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/staging' && github.event_name == 'push'

    steps:
      - name: Déclenchement du déploiement Render préprod
        run: |
          echo "Déploiement Render préprod — commit ${{ github.sha }}"
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_GRADIO_PREPROD }}" \
            | grep -q "200" \
            && echo "Deploy hook déclenché avec succès" \
            || (echo "Erreur lors de l'appel au deploy hook" && exit 1)
