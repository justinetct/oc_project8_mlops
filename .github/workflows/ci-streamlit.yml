# CI — Service Streamlit de monitoring crédit
#
# Déclenché sur push (main, staging, feature/*, fix/*) ou pull request vers main.
# 2 étapes : tests → build Docker.
#
# Stratégie de déploiement :
#   - staging → Render préprod (After CI Checks Pass, géré par Render)
#   - main    → Render prod (à venir)
#   - autres  → tests + build Docker uniquement
#
# Hugging Face Spaces a été abandonné (instabilité persistante).

name: CI Streamlit

on:
  push:
    branches:
      - main
      - staging
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # 1. Tests unitaires avec Poetry
  # -----------------------------------------------------------------------
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache des dépendances Poetry
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Installation des dépendances
        run: poetry install --only main,gradio,streamlit,dev

      - name: Lancement des tests
        run: poetry run pytest tests/ -v

      - name: Vérification cohérence requirements
        run: |
          poetry self add poetry-plugin-export
          make export-requirements-streamlit
          git diff --exit-code requirements.streamlit.txt || \
            echo "::warning::requirements.streamlit.txt n'est pas à jour avec poetry.lock"

  # -----------------------------------------------------------------------
  # 2. Build de l'image Docker
  # -----------------------------------------------------------------------
  docker:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Build de l'image Streamlit
        run: docker build -f Dockerfile.streamlit -t monitoring-streamlit .
